<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yobby Technologies — Connectivity Division Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8F7; --panel:#FFFFFF; --panel-2:#EEF2F1; --ink:#0B2027; --ink-soft:#4B6167;
  --line:#DDE6E4; --accent:#0E7C7B; --accent-ink:#ffffff; --gold:#E8A33D; --danger:#C4453A;
  --good:#1E8E5A; --shadow:0 8px 24px rgba(11,32,39,.08);
  --radius:14px; font-size:16px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#081418; --panel:#0F2126; --panel-2:#142B31; --ink:#EAF3F1; --ink-soft:#9FB6B4;
    --line:#1F3B41; --accent:#3ADBC0; --accent-ink:#062522; --gold:#F2B94E; --danger:#FF7A6E; --good:#4FD48A;
    --shadow:0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#081418; --panel:#0F2126; --panel-2:#142B31; --ink:#EAF3F1; --ink-soft:#9FB6B4;
  --line:#1F3B41; --accent:#3ADBC0; --accent-ink:#062522; --gold:#F2B94E; --danger:#FF7A6E; --good:#4FD48A;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;font-family:'Sora',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---- Topbar ---- */
header.top{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo svg{flex:none}
.logo .word{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.logo .word b{font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.logo .word span{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .15s ease, background .2s;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn:hover{background:var(--panel-2)}

/* ---- Layout ---- */
.shell{display:flex;max-width:1180px;margin:0 auto}
nav.side{
  width:210px;flex:none;padding:18px 10px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:64px;align-self:flex-start;height:calc(100vh - 64px);
}
nav.side button{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:transparent;
  border-radius:10px;color:var(--ink-soft);font-size:14.5px;font-weight:600;text-align:left;transition:.15s;
}
nav.side button svg{flex:none;opacity:.85}
nav.side button.active{background:var(--accent);color:var(--accent-ink)}
nav.side button.active svg{opacity:1}
nav.side button:not(.active):hover{background:var(--panel-2);color:var(--ink)}

main{flex:1;min-width:0;padding:18px 18px 90px}
.view{display:none;animation:fade .35s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h1.page-title{font-size:20px;margin:2px 0 4px;font-weight:800}
p.page-sub{color:var(--ink-soft);margin:0 0 18px;font-size:13.5px}

/* ---- Cards / grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.kpi .lbl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:700;margin-top:6px}
.kpi .sub{font-size:11.5px;margin-top:4px;color:var(--good)}
.kpi .sub.neg{color:var(--danger)}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:60px;height:60px;border-radius:50%;background:var(--accent);opacity:.08}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 12px;font-weight:700}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}

.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.bars .bar{flex:1;border-radius:6px 6px 0 0;background:var(--accent);position:relative;min-height:4px;transition:height .5s ease}
.bars .bar span{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--ink-soft);white-space:nowrap}
.bars-labels{display:flex;gap:6px;margin-top:6px}
.bars-labels span{flex:1;text-align:center;font-size:10px;color:var(--ink-soft)}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge.live{background:rgba(30,142,90,.15);color:var(--good)}
.badge.setup{background:rgba(232,163,61,.18);color:var(--gold)}
.badge.plan{background:rgba(75,97,103,.15);color:var(--ink-soft)}

.hotspot-card{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;background:var(--panel-2)}
.hotspot-card .hh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hotspot-card h3{margin:0;font-size:14.5px}
.hotspot-card .loc{font-size:12px;color:var(--ink-soft);margin-top:2px}
.hotspot-card .stats{display:flex;gap:16px;margin-top:10px}
.hotspot-card .stats div b{display:block;font-family:'JetBrains Mono',monospace;font-size:14px}
.hotspot-card .stats div span{font-size:10.5px;color:var(--ink-soft)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.amt-in{color:var(--good);font-family:'JetBrains Mono',monospace}
.amt-out{color:var(--danger);font-family:'JetBrains Mono',monospace}
.tbl-wrap{overflow-x:auto}
.del{background:none;border:none;color:var(--ink-soft);font-size:15px;padding:2px 6px;border-radius:6px}
.del:hover{color:var(--danger);background:rgba(196,69,58,.1)}

.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl-item{position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-21px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl-item .d{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace}
.tl-item .t{font-weight:700;font-size:13.5px;margin:2px 0}
.tl-item .n{font-size:12.5px;color:var(--ink-soft)}

.team-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel-2)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.team-card .who b{display:block;font-size:14px}
.team-card .who span{font-size:12px;color:var(--ink-soft)}

.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:10px;
  font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:transform .12s, background .2s;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:7px 10px;font-size:12px}

.actions-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}

.investor-box{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.progress-bar{height:9px;border-radius:6px;background:var(--panel-2);overflow:hidden;margin-top:8px}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:6px;transition:width .6s ease}

.report-text{white-space:pre-wrap;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;background:var(--panel-2);border-radius:10px;padding:14px;max-height:420px;overflow:auto;border:1px solid var(--line)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(4,10,12,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.overlay.open{display:flex}
.sheet{
  background:var(--panel);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  animation:up .25s ease; max-height:85vh;overflow:auto;
}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:16px;margin-bottom:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 14px;font-size:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{
  width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;
}
.sheet .actions{display:flex;gap:10px;margin-top:16px}
.sheet .actions .btn{flex:1;justify-content:center}

.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- Auth ---- */
#app{display:none}
.auth-wrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow);animation:up .3s ease}
.auth-card .logo-wrap{display:flex;justify-content:center;margin-bottom:8px}
.auth-card h1{font-size:17px;text-align:center;margin:12px 0 2px;font-weight:800}
.auth-card p.sub{text-align:center;color:var(--ink-soft);font-size:12.5px;margin:0 0 20px}
.role-tabs{display:flex;gap:6px;background:var(--panel-2);padding:4px;border-radius:11px;margin-bottom:18px}
.role-tabs button{flex:1;padding:8px;border:none;background:none;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.role-tabs button.active{background:var(--panel);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.auth-err{color:var(--danger);font-size:12px;margin:-6px 0 12px;display:none}
.auth-err.show{display:block}
.demo-hint{margin-top:16px;padding:10px 12px;background:var(--panel-2);border-radius:10px;font-size:11.5px;color:var(--ink-soft);line-height:1.6}
.role-badge{font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--panel-2);color:var(--ink-soft);white-space:nowrap;border:1px solid var(--line)}
.lock-note{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink-soft);margin-bottom:16px}

/* bottom nav for mobile */
nav.bottom{display:none}
@media (max-width:820px){
  nav.side{display:none}
  nav.bottom{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;
  }
  nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--ink-soft);font-size:10px;font-weight:700;padding:6px 2px;border-radius:10px}
  nav.bottom button.active{color:var(--accent)}
  main{padding-bottom:84px}
  .logo .word span{max-width:140px}
}
@media(min-width:821px){ .shell{gap:6px} }
</style>
</head>
<body>

<div class="auth-wrap" id="authScreen">
  <div class="auth-card">
    <div class="logo-wrap">
      <svg width="42" height="42" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="17" fill="var(--accent)"/><path d="M9 21a11 11 0 0 1 16 0M12.3 17.7a6.4 6.4 0 0 1 9.4 0M17 22.2h.01" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round"/></svg>
    </div>
    <h1>Yobby Technologies</h1>
    <p class="sub">Connectivity &amp; Hotspots — Nakuru</p>
    <div class="role-tabs" id="roleTabs">
      <button class="active" data-role="admin">Admin</button>
      <button data-role="investor">Investor</button>
    </div>
    <div class="field"><label>Username</label><input type="text" id="loginUser" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <div class="auth-err" id="loginErr">Incorrect username or password.</div>
    <button class="btn primary" id="loginBtn" style="width:100%;justify-content:center">Log in</button>
    <div class="demo-hint" id="demoHint"></div>
  </div>
</div>

<div id="app">
<header class="top">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <circle cx="17" cy="17" r="17" fill="var(--accent)"/>
      <path d="M9 21a11 11 0 0 1 16 0M12.3 17.7a6.4 6.4 0 0 1 9.4 0M17 22.2h.01" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <div class="word"><b>Yobby Technologies</b><span>Connectivity &amp; Hotspots · Nakuru</span></div>
  </div>
  <div class="top-actions">
    <span class="role-badge" id="roleBadge"></span>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
      <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="shareBtn" title="Share" aria-label="Share">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-3.9M8.6 13.5l6.8 3.9"/></svg>
    </button>
    <button class="icon-btn" id="logoutBtn" title="Log out" aria-label="Log out">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <nav class="side" id="sideNav"></nav>
  <main id="main"></main>
</div>
<nav class="bottom" id="bottomNav"></nav>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============ */
const STORE_KEY = 'ybt_connectivity_v1';
const THEME_KEY = 'ybt_theme';
const SESSION_KEY = 'ybt_session';

/* ============ AUTH ============ */
const USERS = {
  admin:    { username:'yobby',  password:'admin2026',  role:'admin',    name:'Yobby' },
  investor: { username:'judithogal@gmail.com', password:'invest2026', role:'investor', name:'Judith Ogal' }
};
let session = null;
try{ session = JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){}
const isAdmin = ()=> !!(session && session.role==='admin');

let selectedRole = 'admin';
function updateDemoHint(){
  const u = USERS[selectedRole];
  document.getElementById('demoHint').innerHTML = `${selectedRole} login — Username: <b>${u.username}</b> · Password: <b>${u.password}</b>`;
}
document.querySelectorAll('#roleTabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#roleTabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); selectedRole = b.dataset.role; updateDemoHint();
});
updateDemoHint();

document.getElementById('loginBtn').onclick = ()=>{
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const acct = USERS[selectedRole];
  if(u===acct.username && p===acct.password){
    session = { role:acct.role, name:acct.name };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    document.getElementById('loginErr').classList.remove('show');
    showApp();
  } else {
    document.getElementById('loginErr').classList.add('show');
  }
};
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
document.getElementById('logoutBtn').onclick = ()=>{
  session = null; localStorage.removeItem(SESSION_KEY);
  document.getElementById('app').style.display='none';
  document.getElementById('authScreen').style.display='flex';
  document.getElementById('loginUser').value=''; document.getElementById('loginPass').value='';
  toast('Logged out');
};
function showApp(){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('roleBadge').textContent = (session.role==='admin'?'Admin — ':'Investor — ') + session.name;
  current = 'overview';
  buildNav(); render();
}

const seed = {
  agreementStart: '2026-09-01',
  investor: { name:'Judith Ogal', commitment:300000, received:150000, structure:'25% share of division net profit, running for 36 months — no equity stake' },

    { id:'h3', name:'Kaptembwo Community Hotspot', area:'Kaptembwo, Nakuru', status:'setup', clients:0, monthly:0, launched:null },
    { id:'h4', name:'London Estate Hotspot', area:'London Estate, Nakuru', status:'plan', clients:0, monthly:0, launched:null }
  ],
  income: [

    { id:2, date:'2026-09-01', type:'out', desc:'Networking tools & equipment (crimpers, testers, drill set)', amount:22000 },
    { id:3, date:'2026-09-02', type:'out', desc:'Cabling stock — Cat6 rolls, RJ45, trunking', amount:31000 },
    { id:4, date:'2026-09-02', type:'out', desc:'Router & access-point inventory', amount:18000 },
    { id:5, date:'2026-09-03', type:'in',  desc:'Milimani Hotspot — client connection fees (first batch)', amount:6800 },
    { id:6, date:'2026-09-04', type:'in',  desc:'Milimani Hotspot — daily client top-ups', amount:3400 },
    { id:7, date:'2026-09-05', type:'out', desc:'Technician wages — Week 1 and 2', amount:9000 },
    { id:8, date:'2026-09-06', type:'in',  desc:'Section 58 Hotspot — launch-week client payments', amount:6400 },
    { id:9, date:'2026-09-07', type:'in',  desc:'Milimani + Section 58 — daily client top-ups', amount:3800 },
    { id:10,date:'2026-09-08', type:'in',  desc:'Weekly maintenance retainers (10 clients)', amount:6000 },
    { id:11,date:'2026-09-11', type:'out', desc:'Branding and Marketing', amount:10000 },
    { id:12, date:'2026-09-12', type:'in',  desc:'Milimani + Section 58 — daily client top-ups', amount:6800 }
  
  ],
  team: [
    { id:1, name:'D. Kiplangat', role:'Lead Field Technician', area:'Milimani' },
    { id:2, name:'B. Wanjiru', role:'Installation Technician', area:'Section 58' },
    { id:3, name:'Yobby', role:'Founder — Systems & Billing Dashboard', area:'All sites' }
  ],
  progress: [
    { date:'2026-09-01', title:'Agreement signed & capital received', note:'Investor tranche of KES 150,000 received from Judith Ogal against the KES 300,000 commitment.' },
    { date:'2026-09-02', title:'Equipment & stock procured', note:'Tools, Cat6 cabling stock and initial router/AP inventory purchased.' },
    { date:'2026-09-03', title:'Milimani Estate hotspot went live', note:'First hotspot switched on; 30 clients connected in the opening days.' },
    { date:'2026-09-05', title:'Technician team on-boarded', note:'Two field technicians started, covering Milimani and Section 58.' },
    { date:'2026-09-06', title:'Section 58 hotspot went live', note:'Second hotspot launched — expansion within Nakuru town, no new towns yet.' },
    { date:'2026-09-08', title:'Week 1 close-out', note:'Two hotspots live, Kaptembwo in setup, London Estate planned next. Still Nakuru-only by design for Phase 1.' }
  ]
};

function loadData(){
  const raw = localStorage.getItem(STORE_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return JSON.parse(JSON.stringify(seed));
}
let data = loadData();
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

/* ============ THEME ============ */
function applyTheme(t){
  if(t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
  const sun = t==='dark';
  document.getElementById('themeIcon').innerHTML = sun
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>'
    : '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>';
}
let savedTheme = localStorage.getItem(THEME_KEY) || '';
applyTheme(savedTheme);
document.getElementById('themeBtn').onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  let next;
  if(!cur) next = sysDark ? 'light' : 'dark';
  else next = cur==='dark' ? 'light' : 'dark';
  applyTheme(next); localStorage.setItem(THEME_KEY, next);
};

/* ============ NAV ============ */
const views = [
  {id:'overview', label:'Overview', icon:'<path d="M4 13h6V4H4v9Zm10 7h6V4h-6v16ZM4 20h6v-4H4v4Z"/>'},
  {id:'income', label:'Income', icon:'<path d="M12 1v22M17 5.5c0-2-2-3-5-3s-5 1.3-5 3.2S9 8.5 12 9s5 1.3 5 3.3-2 3.2-5 3.2-5-1-5-3"/>'},
  {id:'hotspots', label:'Hotspots', icon:'<path d="M5 13a9.7 9.7 0 0 1 14 0M8 16.5a5.4 5.4 0 0 1 8 0M12 20h.01"/><circle cx="12" cy="4" r="2"/>'},
  {id:'team', label:'Team', icon:'<circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 8.5a3 3 0 1 1 3.6 2.9M20 20a5.6 5.6 0 0 0-4-5.3"/>'},
  {id:'reports', label:'Reports', icon:'<path d="M6 2h9l4 4v16H6z"/><path d="M9 12h6M9 16h6M9 8h3"/>'}
];
let current = 'overview';
const investorViews = ['overview','hotspots','reports'];
function buildNav(){
  const roleViews = isAdmin() ? views : views.filter(v=>investorViews.includes(v.id));
  if(!roleViews.find(v=>v.id===current)) current = 'overview';
  const side = document.getElementById('sideNav');
  const bottom = document.getElementById('bottomNav');
  side.innerHTML = roleViews.map(v=>`<button data-v="${v.id}" class="${v.id===current?'active':''}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${v.icon}</svg>${v.label}</button>`).join('');
  bottom.innerHTML = roleViews.map(v=>`<button data-v="${v.id}" class="${v.id===current?'active':''}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${v.icon}</svg>${v.label}</button>`).join('');
  [...side.children,...bottom.children].forEach(b=>b.onclick=()=>{ current=b.dataset.v; buildNav(); render(); window.scrollTo({top:0,behavior:'smooth'}); });
}

/* ============ HELPERS ============ */
const fmt = n => 'KES ' + Number(n).toLocaleString('en-KE');
const totalIn = ()=> data.income.filter(i=>i.type==='in').reduce((s,i)=>s+i.amount,0);
const totalOut = ()=> data.income.filter(i=>i.type==='out').reduce((s,i)=>s+i.amount,0);
const netProfit = ()=> totalIn()-totalOut();
const investorShare = ()=> Math.round(netProfit()*0.25);
const activeHotspots = ()=> data.hotspots.filter(h=>h.status==='live').length;
const totalClients = ()=> data.hotspots.reduce((s,h)=>s+h.clients,0);
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function dateShort(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }

/* ============ RENDER ============ */
function render(){
  const main = document.getElementById('main');
  if(current==='overview') main.innerHTML = viewOverview();
  if(current==='income') main.innerHTML = viewIncome();
  if(current==='hotspots') main.innerHTML = viewHotspots();
  if(current==='team') main.innerHTML = viewTeam();
  if(current==='reports') main.innerHTML = viewReports();
  wireView();
}

function viewOverview(){
  const days = data.income.reduce((m,i)=>{ m[i.date]=(m[i.date]||0)+(i.type==='in'?i.amount:-i.amount); return m; },{});
  const dkeys = Object.keys(days).sort();
  const max = Math.max(...dkeys.map(k=>Math.abs(days[k])),1000);
  const pct = Math.min(100, Math.round(data.investor.received/data.investor.commitment*100));
  return `
  <h1 class="page-title">Overview</h1>
  <p class="page-sub">Agreement started ${dateShort(data.agreementStart)}, 2026 · Nakuru-based connectivity &amp; hotspot division</p>

  <div class="grid">
    <div class="kpi"><div class="lbl">Total revenue</div><div class="val">${fmt(totalIn())}</div><div class="sub">Since agreement start</div></div>
    <div class="kpi"><div class="lbl">Net profit</div><div class="val">${fmt(netProfit())}</div><div class="sub">After ${fmt(totalOut())} expenses</div></div>
    <div class="kpi"><div class="lbl">Investor share (25%)</div><div class="val">${fmt(investorShare())}</div><div class="sub">Accrued so far</div></div>
    <div class="kpi"><div class="lbl">Active hotspots</div><div class="val">${activeHotspots()} <span style="font-size:13px;color:var(--ink-soft)">/ ${data.hotspots.length}</span></div><div class="sub">${totalClients()} clients connected</div></div>
  </div>

  ${!isAdmin()?'<div class="lock-note">🔒 View-only investor access — figures are compiled from the admin-maintained ledger.</div>':''}

  <div class="panel">
    <div class="row-between"><h2 style="margin:0">Investor commitment — ${data.investor.name}</h2>${isAdmin()?'<button class="btn primary sm" id="recordPaymentBtn">+ Record payment</button>':''}</div>
    <div class="investor-box">
      <div><b class="mono" style="font-size:18px">${fmt(data.investor.received)}</b><div style="font-size:12px;color:var(--ink-soft)">received of ${fmt(data.investor.commitment)} committed</div></div>
      <div><b class="mono" style="font-size:18px">${fmt(data.investor.commitment-data.investor.received)}</b><div style="font-size:12px;color:var(--ink-soft)">remaining to full commitment</div></div>
      <div style="font-size:12px;color:var(--ink-soft);max-width:260px">${data.investor.structure}</div>
    </div>
    <div class="progress-bar"><i style="width:${pct}%"></i></div>
  </div>

  <div class="panel">
    <h2>Daily cash flow — first week</h2>
    <div class="bars">${dkeys.map(k=>`<div class="bar" style="height:${Math.max(6,Math.abs(days[k])/max*100)}%;background:${days[k]<0?'var(--danger)':'var(--accent)'}"><span>${(days[k]>=0?'+':'')+ (days[k]/1000).toFixed(1)+'k'}</span></div>`).join('')}</div>
    <div class="bars-labels">${dkeys.map(k=>`<span>${dateShort(k)}</span>`).join('')}</div>
  </div>

  <div class="panel">
    <h2>Latest activity</h2>
    <div class="timeline">
      ${data.progress.slice().reverse().slice(0,4).map(p=>`<div class="tl-item"><div class="d">${dateShort(p.date)}, 2026</div><div class="t">${p.title}</div><div class="n">${p.note}</div></div>`).join('')}
    </div>
  </div>`;
}

function viewIncome(){
  const rows = data.income.slice().sort((a,b)=>b.date.localeCompare(a.date));
  return `
  <h1 class="page-title">Income &amp; Expenses</h1>
  <p class="page-sub">Full transaction history for the connectivity &amp; hotspot division</p>
  <div class="grid">
    <div class="kpi"><div class="lbl">Money in</div><div class="val" style="color:var(--good)">${fmt(totalIn())}</div></div>
    <div class="kpi"><div class="lbl">Money out</div><div class="val" style="color:var(--danger)">${fmt(totalOut())}</div></div>
    <div class="kpi"><div class="lbl">Net position</div><div class="val">${fmt(netProfit())}</div></div>
  </div>
  <div class="panel">
    <div class="row-between"><h2 style="margin:0">Transactions</h2>${isAdmin()?'<button class="btn primary sm" id="addIncomeBtn">+ Add entry</button>':''}</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Date</th><th>Description</th><th>Amount</th><th></th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td class="mono" style="white-space:nowrap">${dateShort(r.date)}</td><td>${r.desc}</td><td class="${r.type==='in'?'amt-in':'amt-out'}">${r.type==='in'?'+':'−'}${fmt(r.amount)}</td><td>${isAdmin()?`<button class="del" data-id="${r.id}" data-kind="income">✕</button>`:''}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

function viewHotspots(){
  const statusLabel = {live:'Live',setup:'Setting up',plan:'Planned'};
  return `
  <h1 class="page-title">Hotspots &amp; Progress</h1>
  <p class="page-sub">Expansion so far is within Nakuru town only — no new towns opened yet</p>
  ${!isAdmin()?'<div class="lock-note">🔒 View-only — status changes are made by Yobby Technologies.</div>':''}
  ${data.hotspots.map(h=>`
    <div class="hotspot-card">
      <div class="hh"><div><h3>${h.name}</h3><div class="loc">${h.area}</div></div><span class="badge ${h.status}">${statusLabel[h.status]}</span></div>
      <div class="stats">
        <div><b class="mono">${h.clients}</b><span>Clients</span></div>
        <div><b class="mono">${fmt(h.monthly)}</b><span>Monthly revenue</span></div>
        <div><b class="mono">${h.launched?dateShort(h.launched):'—'}</b><span>Launched</span></div>
      </div>
      ${isAdmin()?`<div style="margin-top:10px;display:flex;gap:8px;align-items:center">
        <select class="hs-status" data-id="${h.id}" style="flex:1;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:12.5px">
          <option value="plan" ${h.status==='plan'?'selected':''}>Planned</option>
          <option value="setup" ${h.status==='setup'?'selected':''}>Setting up</option>
          <option value="live" ${h.status==='live'?'selected':''}>Live</option>
        </select>
        <button class="btn ghost sm hs-save" data-id="${h.id}">Update</button>
      </div>`:''}
    </div>`).join('')}

  <div class="panel" style="margin-top:18px">
    <div class="row-between"><h2 style="margin:0">Progress log</h2>${isAdmin()?'<button class="btn primary sm" id="addProgressBtn">+ Add update</button>':''}</div>
    <div class="timeline">
      ${data.progress.slice().reverse().map(p=>`<div class="tl-item"><div class="d">${dateShort(p.date)}, 2026</div><div class="t">${p.title}</div><div class="n">${p.note}</div></div>`).join('')}
    </div>
  </div>`;
}

function viewTeam(){
  return `
  <h1 class="page-title">Team</h1>
  <p class="page-sub">Who is working on the ground and on the systems</p>
  <div class="panel">
    <div class="row-between"><h2 style="margin:0">Roster — ${data.team.length}</h2>${isAdmin()?'<button class="btn primary sm" id="addTeamBtn">+ Add member</button>':''}</div>
    ${data.team.map(t=>`<div class="team-card"><div class="avatar">${t.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div class="who" style="flex:1"><b>${t.name}</b><span>${t.role} · ${t.area}</span></div>${isAdmin()?`<button class="del" data-id="${t.id}" data-kind="team">✕</button>`:''}</div>`).join('')}
  </div>`;
}

function viewReports(){
  const pct = Math.min(100, Math.round(data.investor.received/data.investor.commitment*100));
  const report = buildReportText();
  return `
  <h1 class="page-title">Reports</h1>
  <p class="page-sub">Shared summary for ${data.investor.name} and Yobby Technologies · Generated ${new Date().toLocaleString('en-KE',{dateStyle:'medium',timeStyle:'short'})}</p>
  <div class="panel">
    <div class="actions-row">
      <button class="btn primary" id="downloadBtn">⬇ Download report</button>
      <button class="btn ghost" id="printBtn">🖨 Print</button>
      <button class="btn ghost" id="shareReportBtn">↗ Share</button>
    </div>
    <div class="report-text">${report}</div>
  </div>`;
}
function buildReportText(){
  const pct = Math.min(100, Math.round(data.investor.received/data.investor.commitment*100));
  let t = `YOBBY TECHNOLOGIES LTD — CONNECTIVITY & HOTSPOT DIVISION\nProgress Report — Nakuru\nAgreement start: ${data.agreementStart}\n\n`;
  t += `INVESTOR: ${data.investor.name}\nCommitment: ${fmt(data.investor.commitment)}\nReceived: ${fmt(data.investor.received)} (${pct}%)\nStructure: ${data.investor.structure}\n\n`;
  t += `FINANCIAL SUMMARY\nTotal revenue: ${fmt(totalIn())}\nTotal expenses: ${fmt(totalOut())}\nNet profit: ${fmt(netProfit())}\nInvestor profit share (25%): ${fmt(investorShare())}\n\n`;
  t += `HOTSPOTS (${data.hotspots.length})\n` + data.hotspots.map(h=>`- ${h.name}, ${h.area} — ${h.status.toUpperCase()} — ${h.clients} clients — ${fmt(h.monthly)}/mo`).join('\n') + '\n\n';
  t += `TEAM (${data.team.length})\n` + data.team.map(m=>`- ${m.name} — ${m.role} (${m.area})`).join('\n') + '\n\n';
  t += `PROGRESS LOG\n` + data.progress.map(p=>`${p.date} — ${p.title}\n  ${p.note}`).join('\n') + '\n\n';
  t += `TRANSACTIONS\n` + data.income.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(i=>`${i.date}  ${i.type==='in'?'+':'-'}${fmt(i.amount)}  ${i.desc}`).join('\n');
  return t;
}

/* ============ MODALS ============ */
function openSheet(html){ document.getElementById('sheet').innerHTML = html; document.getElementById('overlay').classList.add('open'); }
function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });

function wireView(){
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    if(!isAdmin()) return;
    if(b.dataset.kind==='income'){ data.income = data.income.filter(i=>i.id!=b.dataset.id); save(); render(); toast('Entry removed'); }
    if(b.dataset.kind==='team'){ data.team = data.team.filter(t=>t.id!=b.dataset.id); save(); render(); toast('Member removed'); }
  });
  document.querySelectorAll('.hs-save').forEach(b=>b.onclick=()=>{
    if(!isAdmin()) return;
    const sel = document.querySelector(`.hs-status[data-id="${b.dataset.id}"]`);
    const h = data.hotspots.find(x=>x.id===b.dataset.id);
    if(h && sel){ h.status = sel.value; if(h.status==='live' && !h.launched) h.launched = new Date().toISOString().slice(0,10); save(); render(); toast('Hotspot updated'); }
  });
  const recordPay = document.getElementById('recordPaymentBtn');
  if(recordPay) recordPay.onclick = ()=>{ openSheet(`
    <h3>Record investor payment</h3>
    <div class="field"><label>Date</label><input type="date" id="rp_date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Amount (KES)</label><input type="number" id="rp_amt" placeholder="0"></div>
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn primary" id="saveRp">Save</button></div>`);
    document.getElementById('saveRp').onclick = ()=>{
      const amt = Number(document.getElementById('rp_amt').value);
      if(!amt){ toast('Enter an amount'); return; }
      data.investor.received += amt;
      data.income.push({id:Date.now(), date:document.getElementById('rp_date').value, type:'in', desc:`Investor tranche received — ${data.investor.name}`, amount:amt});
      save(); closeSheet(); render(); toast('Payment recorded');
    };
  };
  const addIncome = document.getElementById('addIncomeBtn');
  if(addIncome) addIncome.onclick = ()=>{ openSheet(`
    <h3>Add income / expense</h3>
    <div class="field"><label>Date</label><input type="date" id="f_date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Type</label><select id="f_type"><option value="in">Money in</option><option value="out">Money out</option></select></div>
    <div class="field"><label>Description</label><input type="text" id="f_desc" placeholder="e.g. Milimani client top-ups"></div>
    <div class="field"><label>Amount (KES)</label><input type="number" id="f_amt" placeholder="0"></div>
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn primary" id="saveIncome">Save</button></div>`);
    document.getElementById('saveIncome').onclick = ()=>{
      const desc=document.getElementById('f_desc').value.trim(); const amt=Number(document.getElementById('f_amt').value);
      if(!desc||!amt){ toast('Fill in description and amount'); return; }
      data.income.push({id:Date.now(), date:document.getElementById('f_date').value, type:document.getElementById('f_type').value, desc, amount:amt});
      save(); closeSheet(); render(); toast('Entry added');
    };
  };

  const addProgress = document.getElementById('addProgressBtn');
  if(addProgress) addProgress.onclick = ()=>{ openSheet(`
    <h3>Add progress update</h3>
    <div class="field"><label>Date</label><input type="date" id="p_date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Title</label><input type="text" id="p_title" placeholder="e.g. Kaptembwo hotspot went live"></div>
    <div class="field"><label>Note</label><textarea id="p_note" rows="3" placeholder="Details for the client report"></textarea></div>
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn primary" id="saveProgress">Save</button></div>`);
    document.getElementById('saveProgress').onclick = ()=>{
      const title=document.getElementById('p_title').value.trim(); const note=document.getElementById('p_note').value.trim();
      if(!title){ toast('Add a title'); return; }
      data.progress.push({date:document.getElementById('p_date').value, title, note});
      save(); closeSheet(); render(); toast('Update added');
    };
  };

  const addTeam = document.getElementById('addTeamBtn');
  if(addTeam) addTeam.onclick = ()=>{ openSheet(`
    <h3>Add team member</h3>
    <div class="field"><label>Name</label><input type="text" id="t_name"></div>
    <div class="field"><label>Role</label><input type="text" id="t_role" placeholder="e.g. Installation Technician"></div>
    <div class="field"><label>Area</label><input type="text" id="t_area" placeholder="e.g. Section 58"></div>
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn primary" id="saveTeam">Save</button></div>`);
    document.getElementById('saveTeam').onclick = ()=>{
      const name=document.getElementById('t_name').value.trim();
      if(!name){ toast('Add a name'); return; }
      data.team.push({id:Date.now(), name, role:document.getElementById('t_role').value||'Team member', area:document.getElementById('t_area').value||'Nakuru'});
      save(); closeSheet(); render(); toast('Member added');
    };
  };

  const dl = document.getElementById('downloadBtn');
  if(dl) dl.onclick = ()=>{
    const blob = new Blob([buildReportText()], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='Yobby-Connectivity-Report.txt'; a.click();
    URL.revokeObjectURL(url); toast('Report downloaded');
  };
  const pr = document.getElementById('printBtn');
  if(pr) pr.onclick = ()=> window.print();
  const sr = document.getElementById('shareReportBtn');
  if(sr) sr.onclick = ()=> doShare(buildReportText());
}

async function doShare(text){
  const payload = { title:'Yobby Technologies — Connectivity Division Report', text: text.slice(0,1400) };
  try{
    if(navigator.share){ await navigator.share(payload); }
    else{ await navigator.clipboard.writeText(text); toast('Report copied to clipboard'); }
  }catch(e){ /* user cancelled */ }
}
document.getElementById('shareBtn').onclick = ()=> doShare(buildReportText());

/* ============ INIT ============ */
if(session && (session.role==='admin'||session.role==='investor')){
  showApp();
}else{
  document.getElementById('authScreen').style.display='flex';
  document.getElementById('app').style.display='none';
}
</script>
